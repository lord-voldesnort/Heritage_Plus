name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
      - run: npm ci
      - name: Configure public API URL
        run: printf 'VITE_API_URL=%s\n' "${{ vars.VITE_API_URL }}" > .env.production
      - run: npm run android:sync
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: heritage-plus-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release-aab:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
      - run: npm ci
      - name: Configure public API URL
        run: printf 'VITE_API_URL=%s\n' "${{ vars.VITE_API_URL }}" > .env.production
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > android/heritage-plus-release.jks
      - run: npm run android:sync
      - run: chmod +x android/gradlew && cd android && ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: heritage-plus-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
